<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse Stock Counter</title>
  <!-- Barcode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      max-width: 500px;
      margin: auto;
      background-color: #f4f4f9;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 15px;
    }

    .top-info {
      background-color: #e9ecef;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      border: 1px solid #ced4da;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .col {
      flex: 1;
    }

    label {
      font-weight: bold;
      margin-top: 8px;
      display: block;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 4px 0 10px 0;
      box-sizing: border-box;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Readonly style */
    input[readonly] {
      background-color: #e9ecef;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      min-height: 200px;
      background-color: #222;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 15px;
      display: none;
    }

    .btn-camera {
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
    }

    .btn-submit {
      width: 100%;
      background-color: #28a745;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn-add-item {
      width: 100%;
      background-color: #17a2b8;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      background-color: #cccccc !important;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .success { color: green; }
    .error { color: red; }
    .loading { color: #0056b3; }
    .warning { color: #d39e00; }
  </style>
</head>
<body>

  <h2>Warehouse Stock Count</h2>

  <!-- Header Info -->
  <div class="top-info">
    <div class="row">
      <div class="col">
        <label for="scannerName">Scanner Name:</label>
        <input type="text" id="scannerName" placeholder="e.g. John / Device 1">
      </div>
      <div class="col">
        <label for="position">Position / Shelf:</label>
        <input type="text" id="position" placeholder="e.g. Aisle 2, Bin 4">
      </div>
    </div>
  </div>

  <!-- Camera Controls -->
  <button type="button" id="camBtn" class="btn-camera" onclick="toggleCamera()">Turn Camera ON</button>
  <div id="reader"></div>

  <form id="stockForm">
    <label for="barcode">Barcode:</label>
    <input type="text" id="barcode" placeholder="Scan or type barcode" oninput="fetchItemName(this.value)" required>

    <label for="itemName">Item Name:</label>
    <input type="text" id="itemName" placeholder="Auto-fetches from Sheet2" readonly>

    <label for="quantity">Quantity to Add:</label>
    <input type="number" id="quantity" value="1" min="1" required>

    <!-- Stock Submission -->
    <button type="button" id="submitBtn" class="btn-submit" onclick="submitData()">Submit Stock</button>

    <!-- Add/Edit Master Database Item in Sheet2 -->
    <button type="button" id="addNewItemBtn" class="btn-add-item" onclick="addNewItemToSheet2(false)">+ Add / Edit Item in Sheet2</button>
  </form>

  <div id="status"></div>

  <script>
    // Paste your Google Apps Script Web App Deployment URL here
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxKWCiSsV0FZ5oyQ1Tm5T9SobwsHLOUws8LtUTds-3oOTJZC-BSGLa_ooDyLdqr1ZWE/exec';

    let html5QrCode = null;
    let isCameraActive = false;
    let debounceTimer;

    function toggleCamera() {
      if (!isCameraActive) {
        startCamera();
      } else {
        stopCamera();
      }
    }

    function startCamera() {
      const camBtn = document.getElementById('camBtn');
      const readerDiv = document.getElementById('reader');

      readerDiv.style.display = 'block';
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: { width: 250, height: 150 }
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanError
      ).then(() => {
        isCameraActive = true;
        camBtn.innerText = "Turn Camera OFF";
        camBtn.style.backgroundColor = "#dc3545";
      }).catch(err => {
        alert("Camera error: " + err);
        readerDiv.style.display = 'none';
      });
    }

    function stopCamera() {
      const camBtn = document.getElementById('camBtn');
      const readerDiv = document.getElementById('reader');

      if (html5QrCode && isCameraActive) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          isCameraActive = false;
          readerDiv.style.display = 'none';
          camBtn.innerText = "Turn Camera ON";
          camBtn.style.backgroundColor = "#007bff";
        }).catch(err => console.log(err));
      }
    }

    function onScanSuccess(decodedText) {
      document.getElementById('barcode').value = decodedText;

      // Audio Beep
      try {
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}

      stopCamera();
      fetchItemName(decodedText);
      document.getElementById('quantity').select();
    }

    function onScanError(error) {
      // Quiet handler during frame scan
    }

    // Fetch Item Name from Sheet2
    function fetchItemName(barcode) {
      clearTimeout(debounceTimer);
      let statusDiv = document.getElementById('status');
      let itemNameInput = document.getElementById('itemName');

      if (!barcode.trim()) {
        itemNameInput.value = '';
        itemNameInput.removeAttribute('readonly'); // Allow typing if empty
        return;
      }

      debounceTimer = setTimeout(() => {
        statusDiv.className = 'loading';
        statusDiv.innerText = 'Searching Sheet2...';

        fetch(`${SCRIPT_URL}?action=getItem&barcode=${encodeURIComponent(barcode)}`)
          .then(res => res.json())
          .then(data => {
            if (data.found && data.itemName) {
              itemNameInput.value = data.itemName;
              itemNameInput.setAttribute('readonly', 'readonly'); // Lock if found
              statusDiv.className = 'success';
              statusDiv.innerText = 'Item found in Sheet2!';
            } else {
              itemNameInput.value = '';
              itemNameInput.removeAttribute('readonly'); // Unlock to allow typing a new name!
              statusDiv.className = 'warning';
              statusDiv.innerText = 'New barcode! Type an Item Name and click "Add / Edit Item in Sheet2".';
            }
          })
          .catch(() => {
            statusDiv.className = '';
            statusDiv.innerText = '';
          });
      }, 300);
    }

    // Add or Update Item in Sheet2 with Duplicate Handling
    function addNewItemToSheet2(allowOverwrite = false) {
      let barcode = document.getElementById('barcode').value.trim();
      let itemName = document.getElementById('itemName').value.trim();
      let statusDiv = document.getElementById('status');
      let addBtn = document.getElementById('addNewItemBtn');

      if (!barcode) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Please scan or enter a barcode first.';
        return;
      }

      if (!itemName) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Please type an Item Name to save to Sheet2.';
        document.getElementById('itemName').focus();
        return;
      }

      addBtn.disabled = true;
      statusDiv.className = 'loading';
      statusDiv.innerText = 'Saving to Sheet2...';

      const payload = {
        action: 'addNewItem',
        barcode: barcode,
        itemName: itemName,
        allowOverwrite: allowOverwrite
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        addBtn.disabled = false;

        if (response.status === "duplicate") {
          // Ask for user confirmation to edit
          let confirmEdit = confirm(`${response.message}\n\nClick OK to OVERWRITE with "${itemName}", or CANCEL to keep the existing name.`);
          if (confirmEdit) {
            addNewItemToSheet2(true); // Call again with allowOverwrite = true
          } else {
            statusDiv.className = 'warning';
            statusDiv.innerText = 'Update cancelled.';
          }
        } else if (response.status === "success") {
          statusDiv.className = 'success';
          statusDiv.innerText = response.message;
          document.getElementById('itemName').setAttribute('readonly', 'readonly');
        } else {
          statusDiv.className = 'error';
          statusDiv.innerText = 'Error: ' + response.message;
        }
      })
      .catch(err => {
        addBtn.disabled = false;
        statusDiv.className = 'error';
        statusDiv.innerText = 'Connection Error: ' + err.message;
      });
    }

    // Submit Stock Entry to Sheet1
    function submitData() {
      let barcode = document.getElementById('barcode').value;
      let quantity = document.getElementById('quantity').value;
      let itemName = document.getElementById('itemName').value;
      let scannerName = document.getElementById('scannerName').value;
      let position = document.getElementById('position').value;
      let statusDiv = document.getElementById('status');
      let btn = document.getElementById('submitBtn');

      if (!barcode || !quantity) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Please enter barcode and quantity.';
        return;
      }

      btn.disabled = true;
      statusDiv.className = 'loading';
      statusDiv.innerText = 'Saving stock record...';

      const payload = {
        action: 'updateStock',
        barcode: barcode,
        quantity: quantity,
        itemName: itemName,
        scannerName: scannerName,
        position: position
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.className = 'success';
        statusDiv.innerText = 'Stock updated successfully!';

        // Clear Barcode and Item Name, reset Quantity
        document.getElementById('barcode').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('itemName').setAttribute('readonly', 'readonly');
        document.getElementById('quantity').value = '1';

        btn.disabled = false;
      })
      .catch(err => {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Error submitting data: ' + err.message;
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
