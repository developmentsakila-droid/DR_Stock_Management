<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamron Warehouse Stock Counter</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      max-width: 500px;
      margin: auto;
      background-color: #f4f4f9;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .top-info {
      background-color: #e9ecef;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      border: 1px solid #ced4da;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .col {
      flex: 1;
    }

    label {
      font-weight: bold;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 4px 0 10px 0;
      box-sizing: border-box;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    input[readonly] {
      background-color: #e9ecef;
      cursor: not-allowed;
    }

    .qty-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .qty-group input {
      margin: 0;
    }

    .btn-calc-toggle {
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 10px 14px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      height: 41px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calc-box {
      display: none;
      background: #ffffff;
      border: 1px solid #007bff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      margin-top: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .calc-display {
      font-size: 16px;
      font-weight: bold;
      text-align: right;
      padding: 8px;
      background-color: #f1f3f5;
      border: 1px solid #ced4da;
      border-radius: 4px;
      margin-bottom: 8px;
      min-height: 20px;
      color: #212529;
    }

    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .calc-btn {
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      background: #e9ecef;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }

    .calc-btn:active {
      background: #ced4da;
    }

    .calc-btn-op {
      background: #ffc107;
    }

    .calc-btn-apply {
      background: #28a745;
      color: white;
      grid-column: span 2;
    }

    .calc-btn-clear {
      background: #dc3545;
      color: white;
    }

    #reader {
      width: 100%;
      min-height: 200px;
      background-color: #222;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 15px;
      display: none;
    }

    .btn-camera {
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit {
      width: 100%;
      background-color: #28a745;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-add-item {
      width: 100%;
      background-color: #17a2b8;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-qa {
      width: 100%;
      background-color: #ffc107;
      color: #212529;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:disabled {
      background-color: #cccccc !important;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .success { color: green; }
    .error { color: red; }
    .loading { color: #0056b3; }
    .warning { color: #d39e00; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 8px;
      max-width: 450px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .report-modal-content {
      background: #ffffff;
      border-radius: 8px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dee2e6;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .modal-header h3 {
      margin: 0;
      color: #333;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #6c757d;
    }

    .modal-select {
      width: 100%;
      padding: 10px;
      margin: 4px 0 10px 0;
      box-sizing: border-box;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: white;
    }

    .icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <h2>
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h14v-8h3L12 3zm0 2.84L18 11v7H6v-7l6-5.16zM10 13h4v5h-4v-5z"/></svg>
    Dreamron Warehouse Stock Count
  </h2>

  <div class="top-info">
    <div class="row">
      <div class="col">
        <label for="scannerName">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          Scanner Name:
        </label>
        <input type="text" id="scannerName" placeholder="e.g. Kamal / Device 1">
      </div>
      <div class="col">
        <label for="position">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          Position:
        </label>
        <input type="text" id="position" placeholder="e.g. Auditor">
      </div>
    </div>
  </div>

  <button type="button" id="camBtn" class="btn-camera" onclick="toggleCamera()">
    <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
    <span id="camBtnText">Turn Camera ON</span>
  </button>
  <div id="reader"></div>

  <form id="stockForm">
    <label for="barcode">
      <svg class="icon" viewBox="0 0 24 24"><path d="M2 4h2v16H2V4zm3 0h1v16H5V4zm2 0h2v16H7V4zm3 0h1v16h-1V4zm2 0h3v16h-3V4zm4 0h1v16h-1V4zm2 0h2v16h-2V4zm3 0h1v16h-1V4z"/></svg>
      Barcode:
    </label>
    
    <input type="text" id="barcode" placeholder="Scan or type barcode" oninput="fetchItemDetails(this.value)" required>

    <button type="button" id="qaBtn" class="btn-qa" onclick="openQADefectModal()" disabled>
      <svg class="icon" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      Add QA Defect
    </button>
    
    <div class="row">
      <div class="col">
        <label for="itemName">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>
          Item Name:
        </label>
        <input type="text" id="itemName" placeholder="Auto-fetches" readonly>
      </div>
      <div class="col">
        <label for="itemCode">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 13H4V4h16v9zM20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 15H6v-2h12v2z"/></svg>
          Item Code:
        </label>
        <input type="text" id="itemCode" placeholder="Auto-fetches" readonly>
      </div>
    </div>

    <label for="quantity">
      <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14H7v-2h3v2zm0-4H7v-2h3v2zm0-4H7V7h3v2zm7 8h-5v-2h5v2zm0-4h-5v-2h5v2zm0-4h-5V7h5v2z"/></svg>
      Quantity to Add:
    </label>
    <div class="qty-group">
      <input type="number" id="quantity" value="" min="0" required>
      <button type="button" class="btn-calc-toggle" onclick="toggleCalculator()" title="Open Quantity Calculator">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      </button>
    </div>

    <div id="calcBox" class="calc-box">
      <div id="calcDisplay" class="calc-display">0</div>
      <div class="calc-buttons">
        <button type="button" class="calc-btn" onclick="calcInput('7')">7</button>
        <button type="button" class="calc-btn" onclick="calcInput('8')">8</button>
        <button type="button" class="calc-btn" onclick="calcInput('9')">9</button>
        <button type="button" class="calc-btn calc-btn-op" onclick="calcInput('×')">×</button>

        <button type="button" class="calc-btn" onclick="calcInput('4')">4</button>
        <button type="button" class="calc-btn" onclick="calcInput('5')">5</button>
        <button type="button" class="calc-btn" onclick="calcInput('6')">6</button>
        <button type="button" class="calc-btn calc-btn-op" onclick="calcInput('+')">+</button>

        <button type="button" class="calc-btn" onclick="calcInput('1')">1</button>
        <button type="button" class="calc-btn" onclick="calcInput('2')">2</button>
        <button type="button" class="calc-btn" onclick="calcInput('3')">3</button>
        <button type="button" class="calc-btn calc-btn-op" onclick="calcInput('-')">-</button>

        <button type="button" class="calc-btn" onclick="calcInput('0')">0</button>
        <button type="button" class="calc-btn calc-btn-clear" onclick="calcClear()">C</button>
        <button type="button" class="calc-btn calc-btn-op" onclick="calcEquals()">=</button>
        <button type="button" class="calc-btn calc-btn-apply" onclick="calcApply()">Apply Qty</button>
      </div>
    </div>

    <button type="button" id="submitBtn" class="btn-submit" onclick="submitData()" disabled>
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      Submit Stock
    </button>

    <button type="button" id="addNewItemBtn" class="btn-add-item" onclick="addNewItemToSheet2()" disabled>
      <svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Add New Item
    </button>
  </form>

  <!-- Summary Report Section Control -->
  <div class="top-info" style="margin-top: 25px;">
    <h3>Summary Report</h3>
    <div class="row">
      <div class="col">
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate">
      </div>
      <div class="col">
        <label for="endDate">End Date:</label>
        <input type="date" id="endDate">
      </div>
    </div>
    <button type="button" class="btn-submit" style="background-color: #17a2b8; margin-top: 10px;" onclick="fetchSummaryReport()">Generate Report (Popup)</button>
  </div>

  <div id="status"></div>

  <!-- Summary Report Modal / Separate Frame Overlay -->
  <div id="reportModal" class="modal-overlay">
    <div class="report-modal-content">
      <div class="modal-header" style="padding: 15px 20px 10px 20px; margin-bottom: 0;">
        <h3>
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          Summary Report Frame
        </h3>
        <button type="button" class="modal-close" onclick="closeReportModal()">✕</button>
      </div>
      <div id="reportResult" style="padding: 15px 20px; overflow-y: auto; flex: 1;"></div>
      <div style="padding: 12px 20px; background-color: #f8f9fa; border-top: 1px solid #dee2e6; display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" id="downloadReportBtn" style="padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;" onclick="downloadCSVReport()" disabled>Download CSV</button>
        <button type="button" style="padding: 10px 15px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;" onclick="closeReportModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- QA Defect Modal -->
  <div id="qaDefectModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>
          <svg class="icon" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
          Log Quality Defect
        </h3>
        <button type="button" class="modal-close" onclick="closeQADefectModal()">✕</button>
      </div>

      <form id="qaDefectForm" onsubmit="handleQADefectSubmit(event)">
        <label for="qaItemCode">Item Code *</label>
        <input type="text" id="qaItemCode" readonly required placeholder="Auto-populated item code">

        <label for="qaItemName">Item Name *</label>
        <input type="text" id="qaItemName" readonly required placeholder="Auto-populated item name">

        <div class="row">
          <div class="col">
            <label for="qaCategory">Defect Category *</label>
            <select id="qaCategory" class="modal-select" required>
              <option value="">Loading categories...</option>
            </select>
          </div>
          <div class="col">
            <label for="qaSeverity">Severity *</label>
            <select id="qaSeverity" class="modal-select" required>
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
              <option value="Critical">Critical</option>
            </select>
          </div>
        </div>

        <label for="qaQuantity">Quantity Affected *</label>
        <input type="number" id="qaQuantity" min="1" value="1" required>

        <label for="qaNotes">Defect Description / Notes</label>
        <input type="text" id="qaNotes" placeholder="Additional details...">

        <div class="row" style="margin-top: 15px;">
          <button type="button" onclick="closeQADefectModal()" style="flex:1; padding:10px; background:#6c757d; color:white; border:none; border-radius:4px; cursor:pointer; font-size:16px;">Cancel</button>
          <button type="submit" style="flex:1; padding:10px; background:#ffc107; color:#212529; border:none; border-radius:4px; cursor:pointer; font-size:16px; font-weight:bold;">Submit Defect</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzSztlq_hVXQgB-Qf8xjtLzZI9u4ICys1rSBDtOR_sQEXAKPeC9niVlPqVxe0-sIoIa/exec';

    let html5QrCode = null;
    let isCameraActive = false;
    let debounceTimer;
    let calcExpr = "";
    let lastReportData = [];

    function toggleCalculator() {
      const calcBox = document.getElementById('calcBox');
      if (calcBox.style.display === 'block') {
        calcBox.style.display = 'none';
      } else {
        calcBox.style.display = 'block';
        calcClear();
      }
    }

    function calcInput(val) {
      calcExpr += val;
      document.getElementById('calcDisplay').innerText = calcExpr;
    }

    function calcClear() {
      calcExpr = "";
      document.getElementById('calcDisplay').innerText = "0";
    }

    function calcEquals() {
      try {
        if (!calcExpr) return;
        let sanitizedExpr = calcExpr.replace(/×/g, '*');
        let result = Function('"use strict"; return (' + sanitizedExpr + ')')();
        calcExpr = String(result);
        document.getElementById('calcDisplay').innerText = calcExpr;
      } catch (e) {
        document.getElementById('calcDisplay').innerText = "Error";
        calcExpr = "";
      }
    }

    function calcApply() {
      calcEquals();
      let finalVal = parseInt(calcExpr, 10);
      if (!isNaN(finalVal) && finalVal > 0) {
        document.getElementById('quantity').value = finalVal;
      }
      document.getElementById('calcBox').style.display = 'none';
    }

    function toggleCamera() {
      if (!isCameraActive) {
        startCamera();
      } else {
        stopCamera();
      }
    }

    function startCamera() {
      const camBtnText = document.getElementById('camBtnText');
      const camBtn = document.getElementById('camBtn');
      const readerDiv = document.getElementById('reader');

      readerDiv.style.display = 'block';
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: { width: 250, height: 150 }
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanError
      ).then(() => {
        isCameraActive = true;
        camBtnText.innerText = "Turn Camera OFF";
        camBtn.style.backgroundColor = "#dc3545";
      }).catch(err => {
        alert("Camera error: " + err);
        readerDiv.style.display = 'none';
      });
    }

    function stopCamera() {
      const camBtnText = document.getElementById('camBtnText');
      const camBtn = document.getElementById('camBtn');
      const readerDiv = document.getElementById('reader');

      if (html5QrCode && isCameraActive) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          isCameraActive = false;
          readerDiv.style.display = 'none';
          camBtnText.innerText = "Turn Camera ON";
          camBtn.style.backgroundColor = "#007bff";
        }).catch(err => console.log(err));
      }
    }

    function onScanSuccess(decodedText) {
      document.getElementById('barcode').value = decodedText;

      try {
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}

      stopCamera();
      fetchItemDetails(decodedText);
      document.getElementById('quantity').select();
    }

    function onScanError(error) {}

    function fetchItemDetails(barcode) {
      clearTimeout(debounceTimer);
      let statusDiv = document.getElementById('status');
      let itemCodeInput = document.getElementById('itemCode');
      let itemNameInput = document.getElementById('itemName');
      let addBtn = document.getElementById('addNewItemBtn');
      let submitBtn = document.getElementById('submitBtn');
      let qaBtn = document.getElementById('qaBtn');

      if (!barcode.trim()) {
        itemCodeInput.value = '';
        itemNameInput.value = '';
        itemCodeInput.setAttribute('readonly', 'readonly');
        itemNameInput.setAttribute('readonly', 'readonly');
        addBtn.disabled = true;
        submitBtn.disabled = true;
        qaBtn.disabled = true;
        statusDiv.innerText = '';
        return;
      }

      debounceTimer = setTimeout(() => {
        statusDiv.className = 'loading';
        statusDiv.innerText = 'Searching....';

        fetch(`${SCRIPT_URL}?action=getItem&barcode=${encodeURIComponent(barcode)}`)
          .then(res => res.json())
          .then(data => {
            if (data.found) {
              itemCodeInput.value = data.itemCode || '';
              itemNameInput.value = data.itemName || '';
              itemCodeInput.setAttribute('readonly', 'readonly');
              itemNameInput.setAttribute('readonly', 'readonly');
              addBtn.disabled = true; 
              submitBtn.disabled = false;
              qaBtn.disabled = false;
              statusDiv.className = 'success';
              statusDiv.innerText = 'Item found!';
            } else {
              itemCodeInput.value = '';
              itemNameInput.value = '';
              itemCodeInput.removeAttribute('readonly');
              itemNameInput.removeAttribute('readonly');
              addBtn.disabled = false; 
              submitBtn.disabled = true;
              qaBtn.disabled = true;
              statusDiv.className = 'warning';
              statusDiv.innerText = 'New barcode detected! Type Item Code & Name';
            }
          })
          .catch(() => {
            statusDiv.className = '';
            statusDiv.innerText = '';
            submitBtn.disabled = true;
            qaBtn.disabled = true;
          });
      }, 300);
    }

    function addNewItemToSheet2() {
      let barcode = document.getElementById('barcode').value.trim();
      let itemCode = document.getElementById('itemCode').value.trim();
      let itemName = document.getElementById('itemName').value.trim();
      let statusDiv = document.getElementById('status');
      let addBtn = document.getElementById('addNewItemBtn');

      if (!barcode) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Please scan or enter a barcode first.';
        return;
      }

      if (!itemName) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Please type an Item Name';
        document.getElementById('itemName').focus();
        return;
      }

      addBtn.disabled = true;
      statusDiv.className = 'loading';
      statusDiv.innerText = 'Saving....';

      const payload = {
        action: 'addNewItem',
        barcode: barcode,
        itemCode: itemCode,
        itemName: itemName
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        if (response.status === "success") {
          statusDiv.className = 'success';
          statusDiv.innerText = 'Saved! Searching again...';
          fetchItemDetails(barcode);
        } else {
          addBtn.disabled = false;
          statusDiv.className = 'error';
          statusDiv.innerText = 'Error: ' + response.message;
        }
      })
      .catch(err => {
        addBtn.disabled = false;
        statusDiv.className = 'error';
        statusDiv.innerText = 'Connection Error: ' + err.message;
      });
    }

    function submitData() {
      let barcode = document.getElementById('barcode').value;
      let quantity = document.getElementById('quantity').value;
      let itemCode = document.getElementById('itemCode').value;
      let itemName = document.getElementById('itemName').value;
      let scannerName = document.getElementById('scannerName').value;
      let position = document.getElementById('position').value;
      let statusDiv = document.getElementById('status');
      let btn = document.getElementById('submitBtn');
      let addBtn = document.getElementById('addNewItemBtn');
      let qaBtn = document.getElementById('qaBtn');

      if (!barcode || !quantity) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Please enter barcode and quantity.';
        return;
      }

      btn.disabled = true;
      statusDiv.className = 'loading';
      statusDiv.innerText = 'Saving stock record...';

      const payload = {
        action: 'updateStock',
        barcode: barcode,
        quantity: quantity,
        itemCode: itemCode,
        itemName: itemName,
        scannerName: scannerName,
        position: position
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.className = 'success';
        statusDiv.innerText = 'Stock updated successfully!';

        document.getElementById('barcode').value = '';
        document.getElementById('itemCode').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('itemCode').setAttribute('readonly', 'readonly');
        document.getElementById('itemName').setAttribute('readonly', 'readonly');
        document.getElementById('quantity').value = '1';

        btn.disabled = true;
        addBtn.disabled = true;
        qaBtn.disabled = true;
      })
      .catch(err => {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Error submitting data: ' + err.message;
        btn.disabled = false;
      });
    }

    function openQADefectModal() {
      document.getElementById('qaDefectForm').reset();
      
      const currentItemCode = document.getElementById('itemCode').value.trim();
      const currentItemName = document.getElementById('itemName').value.trim();

      document.getElementById('qaItemCode').value = currentItemCode || "N/A";
      document.getElementById('qaItemName').value = currentItemName || "N/A";

      const categorySelect = document.getElementById('qaCategory');
      categorySelect.innerHTML = '<option value="">Loading categories...</option>';
      
      document.getElementById('qaDefectModal').style.display = 'flex';

      fetch(`${SCRIPT_URL}?action=getDefectCategories`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success" && data.categories && data.categories.length > 0) {
            categorySelect.innerHTML = data.categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
          } else {
            categorySelect.innerHTML = '<option value="Other">Other</option>';
          }
        })
        .catch(err => {
          console.error("Failed to load categories:", err);
          categorySelect.innerHTML = '<option value="Other">Other</option>';
        });
    }

    function closeQADefectModal() {
      document.getElementById('qaDefectModal').style.display = 'none';
    }

    function handleQADefectSubmit(e) {
      e.preventDefault();

      let itemCode = document.getElementById('qaItemCode').value.trim();
      let itemName = document.getElementById('qaItemName').value.trim();
      let category = document.getElementById('qaCategory').value;
      let severity = document.getElementById('qaSeverity').value;
      let quantity = document.getElementById('qaQuantity').value;
      let notes = document.getElementById('qaNotes').value.trim();
      let scannerName = document.getElementById('scannerName').value;
      let position = document.getElementById('position').value;

      let statusDiv = document.getElementById('status');
      statusDiv.className = 'loading';
      statusDiv.innerText = 'Logging QA defect...';

      const payload = {
        action: 'saveQADefect',
        itemCode: itemCode,
        itemName: itemName,
        category: category,
        severity: severity,
        quantity: quantity,
        notes: notes,
        scannerName: scannerName,
        position: position
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.className = 'success';
        statusDiv.innerText = 'QA Defect logged successfully!';
        closeQADefectModal();

        document.getElementById('barcode').value = '';
        document.getElementById('itemCode').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('itemCode').setAttribute('readonly', 'readonly');
        document.getElementById('itemName').setAttribute('readonly', 'readonly');
        document.getElementById('quantity').value = '';

        document.getElementById('submitBtn').disabled = true;
        document.getElementById('addNewItemBtn').disabled = true;
        document.getElementById('qaBtn').disabled = true;
      })
      .catch(err => {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Error logging QA defect: ' + err.message;
      });
    }

    function fetchSummaryReport() {
      let startDate = document.getElementById('startDate').value;
      let endDate = document.getElementById('endDate').value;
      let statusDiv = document.getElementById('status');
      let reportResultDiv = document.getElementById('reportResult');
      let downloadBtn = document.getElementById('downloadReportBtn');

      // Open popup frame immediately with loading indicator
      document.getElementById('reportModal').style.display = 'flex';
      reportResultDiv.innerHTML = '<p style="text-align: center; color: #0056b3; font-weight: bold; margin-top: 30px;">Generating report...</p>';
      downloadBtn.disabled = true;
      lastReportData = [];

      let url = `${SCRIPT_URL}?action=getSummaryReport`;
      if (startDate) url += `&startDate=${startDate}`;
      if (endDate) url += `&endDate=${endDate}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success" && data.report) {
            statusDiv.className = 'success';
            statusDiv.innerText = 'Report generated successfully!';
            lastReportData = data.report;

            if (data.report.length === 0) {
              reportResultDiv.innerHTML = '<p style="text-align: center; color: #6c757d; margin-top: 30px;">No records found for the selected date range.</p>';
              return;
            }

            downloadBtn.disabled = false;

            let html = `
              <table style="width: 100%; border-collapse: collapse; background: white; font-size: 14px;">
                <thead>
                  <tr style="background-color: #e9ecef; border-bottom: 2px solid #ced4da; position: sticky; top: 0;">
                    <th style="padding: 8px; text-align: left;">Item Code</th>
                    <th style="padding: 8px; text-align: left;">Item Name</th>
                    <th style="padding: 8px; text-align: right;">Stock Added</th>
                    <th style="padding: 8px; text-align: right;">QA Defects</th>
                  </tr>
                </thead>
                <tbody>
            `;

            data.report.forEach(row => {
              html += `
                <tr style="border-bottom: 1px solid #dee2e6;">
                  <td style="padding: 8px;">${row.itemCode}</td>
                  <td style="padding: 8px;">${row.itemName}</td>
                  <td style="padding: 8px; text-align: right; color: green; font-weight: bold;">${row.totalStockAdded}</td>
                  <td style="padding: 8px; text-align: right; color: red; font-weight: bold;">${row.totalDefects}</td>
                </tr>
              `;
            });

            html += `</tbody></table>`;
            reportResultDiv.innerHTML = html;
          } else {
            statusDiv.className = 'error';
            statusDiv.innerText = 'Failed to load report.';
            reportResultDiv.innerHTML = '<p style="text-align: center; color: red; margin-top: 30px;">Failed to load report data from server.</p>';
          }
        })
        .catch(err => {
          statusDiv.className = 'error';
          statusDiv.innerText = 'Error: ' + err.message;
          reportResultDiv.innerHTML = `<p style="text-align: center; color: red; margin-top: 30px;">Error: ${err.message}</p>`;
        });
    }

    function closeReportModal() {
      document.getElementById('reportModal').style.display = 'none';
    }

    function downloadCSVReport() {
      if (!lastReportData || lastReportData.length === 0) return;

      let csvContent = "data:text/csv;charset=utf-8,Item Code,Item Name,Stock Added,QA Defects\r\n";
      
      lastReportData.forEach(row => {
        let line = `"${row.itemCode}","${row.itemName}",${row.totalStockAdded},${row.totalDefects}`;
        csvContent += line + "\r\n";
      });

      let encodedUri = encodeURI(csvContent);
      let link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Warehouse_Stock_Report_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
