<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamron Warehouse Stock Counter</title>
  <!-- Barcode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      max-width: 500px;
      margin: auto;
      background-color: #f4f4f9;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 15px;
    }

    .top-info {
      background-color: #e9ecef;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      border: 1px solid #ced4da;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .col {
      flex: 1;
    }

    label {
      font-weight: bold;
      margin-top: 8px;
      display: block;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 4px 0 10px 0;
      box-sizing: border-box;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Readonly style */
    input[readonly] {
      background-color: #e9ecef;
      cursor: not-allowed;
    }

    /* Quantity Input + Calculator Group */
    .qty-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .qty-group input {
      margin: 0;
    }

    .btn-calc-toggle {
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 10px 14px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      height: 41px;
    }

    /* Calculator Box Styling */
    .calc-box {
      display: none;
      background: #ffffff;
      border: 1px solid #007bff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      margin-top: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .calc-display {
      font-size: 16px;
      font-weight: bold;
      text-align: right;
      padding: 8px;
      background-color: #f1f3f5;
      border: 1px solid #ced4da;
      border-radius: 4px;
      margin-bottom: 8px;
      min-height: 20px;
      color: #212529;
    }

    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .calc-btn {
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      background: #e9ecef;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }

    .calc-btn:active {
      background: #ced4da;
    }

    .calc-btn-op {
      background: #ffc107;
    }

    .calc-btn-apply {
      background: #28a745;
      color: white;
      grid-column: span 2;
    }

    .calc-btn-clear {
      background: #dc3545;
      color: white;
    }

    #reader {
      width: 100%;
      min-height: 200px;
      background-color: #222;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 15px;
      display: none;
    }

    .btn-camera {
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
    }

    .btn-submit {
      width: 100%;
      background-color: #28a745;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-add-item {
      width: 100%;
      background-color: #17a2b8;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      background-color: #cccccc !important;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .success { color: green; }
    .error { color: red; }
    .loading { color: #0056b3; }
    .warning { color: #d39e00; }
  </style>
</head>
<body>

  <h2>Dreamron Warehouse Stock Count</h2>

  <!-- Header Info -->
  <div class="top-info">
    <div class="row">
      <div class="col">
        <label for="scannerName">Scanner Name:</label>
        <input type="text" id="scannerName" placeholder="e.g. Kamal / Device 1">
      </div>
      <div class="col">
        <label for="position">Position:</label>
        <input type="text" id="position" placeholder="e.g. Auditor">
      </div>
    </div>
  </div>

  <!-- Camera Controls -->
  <button type="button" id="camBtn" class="btn-camera" onclick="toggleCamera()">Turn Camera ON</button>
  <div id="reader"></div>

  <form id="stockForm">
    <label for="barcode">Barcode:</label>
    <input type="text" id="barcode" placeholder="Scan or type barcode" oninput="fetchItemDetails(this.value)" required>

    <div class="row">
      <div class="col">
        <label for="itemCode">Item Code:</label>
        <input type="text" id="itemCode" placeholder="Auto-fetches" readonly>
      </div>
      <div class="col">
        <label for="itemName">Item Name:</label>
        <input type="text" id="itemName" placeholder="Auto-fetches" readonly>
      </div>
    </div>

    <!-- Quantity Label & Field with Calculator Toggle -->
    <label for="quantity">Quantity to Add:</label>
    <div class="qty-group">
      <input type="number" id="quantity" value="1" min="1" required>
      <button type="button" class="btn-calc-toggle" onclick="toggleCalculator()" title="Open Quantity Calculator">🧮</button>
    </div>

    <!-- Inline Quantity Calculator Box -->
    <div id="calcBox" class="calc-box">
      <div id="calcDisplay" class="calc-display">0</div>
      <div class="calc-buttons">
        <button type="button" class="calc-btn" onclick="calcInput('7')">7</button>
        <button type="button" class="calc-btn" onclick="calcInput('8')">8</button>
        <button type="button" class="calc-btn" onclick="calcInput('9')">9</button>
        <button type="button" class="calc-btn calc-btn-op" onclick="calcInput('×')">×</button>

        <button type="button" class="calc-btn" onclick="calcInput('4')">4</button>
        <button type="button" class="calc-btn" onclick="calcInput('5')">5</button>
        <button type="button" class="calc-btn" onclick="calcInput('6')">6</button>
        <button type="button" class="calc-btn calc-btn-op" onclick="calcInput('+')">+</button>

        <button type="button" class="calc-btn" onclick="calcInput('1')">1</button>
        <button type="button" class="calc-btn" onclick="calcInput('2')">2</button>
        <button type="button" class="calc-btn" onclick="calcInput('3')">3</button>
        <button type="button" class="calc-btn calc-btn-op" onclick="calcInput('-')">-</button>

        <button type="button" class="calc-btn" onclick="calcInput('0')">0</button>
        <button type="button" class="calc-btn calc-btn-clear" onclick="calcClear()">C</button>
        <button type="button" class="calc-btn calc-btn-op" onclick="calcEquals()">=</button>
        <button type="button" class="calc-btn calc-btn-apply" onclick="calcApply()">Apply Qty</button>
      </div>
    </div>

    <!-- Stock Submission -->
    <button type="button" id="submitBtn" class="btn-submit" onclick="submitData()">Submit Stock</button>

    <!-- Add Item Button (Active ONLY for NEW barcodes) -->
    <button type="button" id="addNewItemBtn" class="btn-add-item" onclick="addNewItemToSheet2()" disabled>+ Add New Item</button>
  </form>

  <div id="status"></div>

  <script>
    // Paste your Google Apps Script Web App Deployment URL here
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwK4N6CsuUBPf7Yvb_pL_NEfUvFxx-xKf8xRBqwRU1FGudM1qLO2-gu-gFf7RJZPe3s/exec';

    let html5QrCode = null;
    let isCameraActive = false;
    let debounceTimer;

    // Quantity Calculator State Variables
    let calcExpr = "";

    function toggleCalculator() {
      const calcBox = document.getElementById('calcBox');
      if (calcBox.style.display === 'block') {
        calcBox.style.display = 'none';
      } else {
        calcBox.style.display = 'block';
        calcClear();
      }
    }

    function calcInput(val) {
      calcExpr += val;
      document.getElementById('calcDisplay').innerText = calcExpr;
    }

    function calcClear() {
      calcExpr = "";
      document.getElementById('calcDisplay').innerText = "0";
    }

    function calcEquals() {
      try {
        if (!calcExpr) return;
        // Replace '×' with JavaScript multiplication operator '*'
        let sanitizedExpr = calcExpr.replace(/×/g, '*');
        let result = Function('"use strict"; return (' + sanitizedExpr + ')')();
        calcExpr = String(result);
        document.getElementById('calcDisplay').innerText = calcExpr;
      } catch (e) {
        document.getElementById('calcDisplay').innerText = "Error";
        calcExpr = "";
      }
    }

    function calcApply() {
      calcEquals();
      let finalVal = parseInt(calcExpr, 10);
      if (!isNaN(finalVal) && finalVal > 0) {
        document.getElementById('quantity').value = finalVal;
      }
      document.getElementById('calcBox').style.display = 'none';
    }

    function toggleCamera() {
      if (!isCameraActive) {
        startCamera();
      } else {
        stopCamera();
      }
    }

    function startCamera() {
      const camBtn = document.getElementById('camBtn');
      const readerDiv = document.getElementById('reader');

      readerDiv.style.display = 'block';
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: { width: 250, height: 150 }
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanError
      ).then(() => {
        isCameraActive = true;
        camBtn.innerText = "Turn Camera OFF";
        camBtn.style.backgroundColor = "#dc3545";
      }).catch(err => {
        alert("Camera error: " + err);
        readerDiv.style.display = 'none';
      });
    }

    function stopCamera() {
      const camBtn = document.getElementById('camBtn');
      const readerDiv = document.getElementById('reader');

      if (html5QrCode && isCameraActive) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          isCameraActive = false;
          readerDiv.style.display = 'none';
          camBtn.innerText = "Turn Camera ON";
          camBtn.style.backgroundColor = "#007bff";
        }).catch(err => console.log(err));
      }
    }

    function onScanSuccess(decodedText) {
      document.getElementById('barcode').value = decodedText;

      try {
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}

      stopCamera();
      fetchItemDetails(decodedText);
      document.getElementById('quantity').select();
    }

    function onScanError(error) {}

    function fetchItemDetails(barcode) {
      clearTimeout(debounceTimer);
      let statusDiv = document.getElementById('status');
      let itemCodeInput = document.getElementById('itemCode');
      let itemNameInput = document.getElementById('itemName');
      let addBtn = document.getElementById('addNewItemBtn');

      if (!barcode.trim()) {
        itemCodeInput.value = '';
        itemNameInput.value = '';
        itemCodeInput.setAttribute('readonly', 'readonly');
        itemNameInput.setAttribute('readonly', 'readonly');
        addBtn.disabled = true;
        statusDiv.innerText = '';
        return;
      }

      debounceTimer = setTimeout(() => {
        statusDiv.className = 'loading';
        statusDiv.innerText = 'Searching....';

        fetch(`${SCRIPT_URL}?action=getItem&barcode=${encodeURIComponent(barcode)}`)
          .then(res => res.json())
          .then(data => {
            if (data.found) {
              itemCodeInput.value = data.itemCode || '';
              itemNameInput.value = data.itemName || '';

              itemCodeInput.setAttribute('readonly', 'readonly');
              itemNameInput.setAttribute('readonly', 'readonly');
              addBtn.disabled = true; 

              statusDiv.className = 'success';
              statusDiv.innerText = 'Item found!';
            } else {
              itemCodeInput.value = '';
              itemNameInput.value = '';

              itemCodeInput.removeAttribute('readonly');
              itemNameInput.removeAttribute('readonly');
              addBtn.disabled = false; 

              statusDiv.className = 'warning';
              statusDiv.innerText = 'New barcode detected! Type Item Code & Name';
            }
          })
          .catch(() => {
            statusDiv.className = '';
            statusDiv.innerText = '';
          });
      }, 300);
    }

    function addNewItemToSheet2() {
      let barcode = document.getElementById('barcode').value.trim();
      let itemCode = document.getElementById('itemCode').value.trim();
      let itemName = document.getElementById('itemName').value.trim();
      let statusDiv = document.getElementById('status');
      let addBtn = document.getElementById('addNewItemBtn');

      if (!barcode) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Please scan or enter a barcode first.';
        return;
      }

      if (!itemName) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Please type an Item Name';
        document.getElementById('itemName').focus();
        return;
      }

      addBtn.disabled = true;
      statusDiv.className = 'loading';
      statusDiv.innerText = 'Saving....';

      const payload = {
        action: 'addNewItem',
        barcode: barcode,
        itemCode: itemCode,
        itemName: itemName
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        if (response.status === "success") {
          statusDiv.className = 'success';
          statusDiv.innerText = response.message;

          document.getElementById('itemCode').setAttribute('readonly', 'readonly');
          document.getElementById('itemName').setAttribute('readonly', 'readonly');
          addBtn.disabled = true;
        } else {
          addBtn.disabled = false;
          statusDiv.className = 'error';
          statusDiv.innerText = 'Error: ' + response.message;
        }
      })
      .catch(err => {
        addBtn.disabled = false;
        statusDiv.className = 'error';
        statusDiv.innerText = 'Connection Error: ' + err.message;
      });
    }

    function submitData() {
      let barcode = document.getElementById('barcode').value;
      let quantity = document.getElementById('quantity').value;
      let itemCode = document.getElementById('itemCode').value;
      let itemName = document.getElementById('itemName').value;
      let scannerName = document.getElementById('scannerName').value;
      let position = document.getElementById('position').value;
      let statusDiv = document.getElementById('status');
      let btn = document.getElementById('submitBtn');
      let addBtn = document.getElementById('addNewItemBtn');

      if (!barcode || !quantity) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Please enter barcode and quantity.';
        return;
      }

      btn.disabled = true;
      statusDiv.className = 'loading';
      statusDiv.innerText = 'Saving stock record...';

      const payload = {
        action: 'updateStock',
        barcode: barcode,
        quantity: quantity,
        itemCode: itemCode,
        itemName: itemName,
        scannerName: scannerName,
        position: position
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.className = 'success';
        statusDiv.innerText = 'Stock updated successfully!';

        // Reset inputs
        document.getElementById('barcode').value = '';
        document.getElementById('itemCode').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('itemCode').setAttribute('readonly', 'readonly');
        document.getElementById('itemName').setAttribute('readonly', 'readonly');
        document.getElementById('quantity').value = '1';

        btn.disabled = false;
        addBtn.disabled = true;
      })
      .catch(err => {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Error submitting data: ' + err.message;
        btn.disabled = false;
      });
    }
  </script>
  <br>
  <label for="Name">Developed By HSDP</label>
</body>
</html>
